# Fork-only: builds an unsigned IPA of this branch on every push, as a workflow artifact
# (to sideload with your own Apple ID). Not meant for upstream.
name: Fork IPA

on:
  push:
    branches: [fork-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Archive
        run: |
          xcodebuild archive \
            -project CloudNow.xcodeproj \
            -scheme CloudNow \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$RUNNER_TEMP/CloudNow.xcarchive" \
            -clonedSourcePackagesDirPath .spm-packages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/CloudNow.xcarchive/Products/Applications/CloudNow.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr CloudNow-airplay.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: CloudNow-airplay-ipa
          path: ${{ runner.temp }}/CloudNow-airplay.ipa
